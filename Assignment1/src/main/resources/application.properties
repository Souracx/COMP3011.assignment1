spring.application.name=Assignment1

spring.threads.virtual.enabled=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

server.error.include-message=always

#OpenAI speech-to-text config 
#Read from OPENAI_API_KEY environment variable. 
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/audio/transcriptions
openai.api.model=gpt-4o-mini-transcribe

